default:
  image:
    repository: "ghcr.io/honeycombio/devrel-opentelemetry-demo"
    tag: "latest"
  replicas: 2
  envOverrides:
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=latest"
components:
  accounting:
    podAnnotations:
      resource.opentelemetry.io/service.name: accounting
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
    service:
      port: 5060
    resources:
      limits:
        memory: 200Mi
    envOverrides:
      - name: PAYMENT_ADDR
        value: payment:8080
      - name: ACCOUNTING_SERVICE_PORT
        value: "5060"
      - name: ASPNETCORE_URLS
        value: "http://*:5060"
  load-generator:
    podAnnotations:
      resource.opentelemetry.io/service.name: load-generator
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
    replicas: 2
    envOverrides:
      # Opt in agent (Bedrock-hitting) loadgen tasks. Locals leave this
      # unset so multiple developer namespaces don't all hammer the
      # shared AWS account's Bedrock concurrently.
      - name: AGENT_LOAD_ENABLED
        value: "true"
  frontend:
    podAnnotations:
      resource.opentelemetry.io/service.name: api-gateway
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
    replicas: 2
    envOverrides:
      - name: PRODUCT_REVIEWS_ADDR
        value: product-reviews:3551
      - name: AUTH_ADDR
        value: auth:8080
      - name: ACCOUNTING_ADDR
        value: accounting:5060
  postgresql:
    podAnnotations:
      resource.opentelemetry.io/service.name: postgresql
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
    resources:
      limits:
        memory: 512Mi
  kafka:
    podAnnotations:
      resource.opentelemetry.io/service.name: kafka
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
    # The chart default of 600Mi OOM-kills the broker: JVM heap (-Xmx400M) plus
    # off-heap (metaspace, direct buffers) plus log-segment page cache exceeds the
    # cgroup limit under load. When Kafka crash-loops, the accounting consumer can't
    # read the "orders" topic and the accounting.order table stays empty. 1Gi gives
    # the ~600M of non-heap headroom Kafka actually needs. (Heap stays 400M.)
    resources:
      limits:
        memory: 1Gi
  frontend-proxy:
    podAnnotations:
      resource.opentelemetry.io/service.name: frontend-proxy
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
    envOverrides:
      - name: ENVOY_ADDR
        value: 0.0.0.0
      - name: STORE_CHAT_HOST
        value: "store-chat"
      - name: STORE_CHAT_PORT
        value: "8080"
      - name: LLM_EVALS_PORT
        value: "8088"
      - name: TELEMETRY_DOCS_HOST
        value: "telemetry-docs"
      - name: TELEMETRY_DOCS_PORT
        value: "8000"
  flagd:
    podAnnotations:
      resource.opentelemetry.io/service.name: flagd
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
    # Rebind the chart's `config-ro` volume to our flagd-custom-config ConfigMap
    # (a superset of the chart's default flags). flagd and the flagd-ui sidecar
    # both mount config-ro, so the UI can now see and edit every flag.
    additionalVolumes:
      - name: config-ro
        configMap:
          name: flagd-custom-config
    # Redeclare the chart's flagd-ui sidecar. Required because skaffold's
    # `--set components.flagd.sidecarContainers[0].imageOverride.*` creates a
    # sparse array element that *replaces* the chart-default sidecar (Helm's
    # --set on arrays doesn't merge into chart defaults). Without this redecl
    # the rendered sidecar has no `name`, and _objects.tpl errors on
    # `.name | lower`. Service identity intentionally inherits from chart
    # defaults (OTEL_SERVICE_NAME → fieldRef on component label = "flagd"),
    # so we don't override env here.
    sidecarContainers:
      - name: flagd-ui
        useDefault:
          env: true
        service:
          port: 4000
        env:
          - name: FLAGD_METRICS_EXPORTER
            value: otel
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://$(OTEL_COLLECTOR_NAME):4318
          - name: FLAGD_UI_PORT
            value: "4000"
          - name: SECRET_KEY_BASE
            value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
        volumeMounts:
          - name: config-rw
            mountPath: /app/data

  ad:
    podAnnotations:
      resource.opentelemetry.io/service.name: ad
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  cart:
    podAnnotations:
      resource.opentelemetry.io/service.name: cart
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  checkout:
    podAnnotations:
      resource.opentelemetry.io/service.name: checkout
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  currency:
    podAnnotations:
      resource.opentelemetry.io/service.name: currency
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  email:
    podAnnotations:
      resource.opentelemetry.io/service.name: email
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  fraud-detection:
    podAnnotations:
      resource.opentelemetry.io/service.name: fraud-detection
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  image-provider:
    podAnnotations:
      resource.opentelemetry.io/service.name: image-provider
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  payment:
    podAnnotations:
      resource.opentelemetry.io/service.name: payment
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  product-catalog:
    podAnnotations:
      resource.opentelemetry.io/service.name: product-catalog
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  quote:
    podAnnotations:
      resource.opentelemetry.io/service.name: quote
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  recommendation:
    podAnnotations:
      resource.opentelemetry.io/service.name: recommendation
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  shipping:
    podAnnotations:
      resource.opentelemetry.io/service.name: shipping
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest
  valkey-cart:
    podAnnotations:
      resource.opentelemetry.io/service.name: valkey-cart
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      resource.opentelemetry.io/service.version: latest

opentelemetry-collector:
  enabled: false

jaeger:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

opensearch:
  enabled: false

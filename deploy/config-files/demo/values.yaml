default:
  image:
    repository: "ghcr.io/honeycombio/devrel-opentelemetry-demo"
    tag: "latest"
  replicas: 2
  envOverrides:
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=latest"
components:
  accounting:
    service:
      port: 5060
    resources:
      limits:
        memory: 200Mi
    envOverrides:
      - name: PAYMENT_ADDR
        value: payment:8080
      - name: ACCOUNTING_SERVICE_PORT
        value: "5060"
      - name: ASPNETCORE_URLS
        value: "http://*:5060"
      # Overrides the chart's own default (Database=otel, a db our schema
      # doesn't use) to match src/postgresql/init.sql -- upstream's unmodified
      # postgresql init script, which provisions astronomy_user/astronomy_db.
      # Kept as a fork amendment (src/postgresql/zz_fork_amendments.sql) rather
      # than editing init.sql, so it merges cleanly from upstream/main.
      - name: DB_CONNECTION_STRING
        value: "Host=postgresql;Username=astronomy_user;Password=astronomy_password;Database=astronomy_db"
  product-catalog:
    envOverrides:
      # Upstream's product-catalog now requires a Postgres-backed catalog
      # (main.go errors out at startup without this); the chart default
      # doesn't set it yet. Same astronomy_user/astronomy_db as accounting --
      # one Postgres instance, not two. lib/pq (Go) wants libpq keyword=value
      # syntax, not the semicolon-delimited form accounting's .NET/Npgsql uses.
      - name: DB_CONNECTION_STRING
        value: "host=postgresql user=astronomy_user password=astronomy_password dbname=astronomy_db sslmode=disable"
  load-generator:
    replicas: 2
    envOverrides:
      # Opt in agent (Bedrock-hitting) loadgen tasks. Locals leave this
      # unset so multiple developer namespaces don't all hammer the
      # shared AWS account's Bedrock concurrently.
      - name: AGENT_LOAD_ENABLED
        value: "true"
      # xk6-otel's own SDK (Go runtime metrics, and the Tracer used by
      # script.js) uses the http OTLP exporters, so it needs the collector's
      # HTTP receiver (4318), not the chart-wide default of 4317 (grpc-only).
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector:4318"
      # k6's own built-in `--out opentelemetry` (test-run metrics) is a
      # separate exporter from xk6-otel and ignores OTEL_EXPORTER_OTLP_*;
      # it needs its own K6_OTEL_* vars or it falls back to localhost:4317.
      - name: K6_OTEL_EXPORTER_PROTOCOL
        value: "grpc"
      - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
        value: "otel-collector:4317"
      - name: K6_OTEL_GRPC_EXPORTER_INSECURE
        value: "true"
  frontend:
    replicas: 2
    envOverrides:
      - name: ACCOUNTING_ADDR
        value: accounting:5060
  shipping:
    envOverrides:
      # Upstream's shipping now uses open-feature-flagd to read feature flags
      # (panics at startup without a reachable provider); the pinned chart
      # (0.39.0) doesn't set these for shipping yet, so it defaults to
      # localhost, which isn't the flagd service.
      - name: FLAGD_HOST
        value: "flagd"
      - name: FLAGD_PORT
        value: "8013"
  postgresql:
    resources:
      limits:
        memory: 512Mi
  kafka:
    # The chart default of 600Mi OOM-kills the broker: JVM heap (-Xmx400M) plus
    # off-heap (metaspace, direct buffers) plus log-segment page cache exceeds the
    # cgroup limit under load. When Kafka crash-loops, the accounting consumer can't
    # read the "orders" topic and the accounting.order table stays empty. 1Gi gives
    # the ~600M of non-heap headroom Kafka actually needs. (Heap stays 400M.)
    resources:
      limits:
        memory: 1Gi
  frontend-proxy:
    envOverrides:
      - name: ENVOY_ADDR
        value: 0.0.0.0
      - name: STORE_CHAT_HOST
        value: "store-chat"
      - name: STORE_CHAT_PORT
        value: "8080"
      - name: LLM_EVALS_PORT
        value: "8088"
      - name: TELEMETRY_DOCS_HOST
        value: "telemetry-docs"
      - name: TELEMETRY_DOCS_PORT
        value: "8000"
      - name: OPAMP_SERVER_HOST
        value: "opamp-server"
      - name: OPAMP_SERVER_UI_PORT
        value: "4321"
      # /profiles/ (firepit) has no backing service deployed -- these are
      # upstream's own placeholder defaults, kept non-empty so envoy's
      # bootstrap validation doesn't crash-loop the whole proxy over one
      # dormant route (an empty socket_address fails hard at parse time; an
      # unresolvable-but-non-empty one just 503s if anyone actually hits it).
      - name: FIREPIT_HOST
        value: "firepit"
      - name: FIREPIT_PORT
        value: "8080"
  flagd:
    # Rebind the chart's `config-ro` volume to our flagd-custom-config ConfigMap
    # (a superset of the chart's default flags). flagd and the flagd-ui sidecar
    # both mount config-ro, so the UI can now see and edit every flag.
    additionalVolumes:
      - name: config-ro
        configMap:
          name: flagd-custom-config
    # Redeclare the chart's flagd-ui sidecar. Required because skaffold's
    # `--set components.flagd.sidecarContainers[0].imageOverride.*` creates a
    # sparse array element that *replaces* the chart-default sidecar (Helm's
    # --set on arrays doesn't merge into chart defaults). Without this redecl
    # the rendered sidecar has no `name`, and _objects.tpl errors on
    # `.name | lower`. Service identity intentionally inherits from chart
    # defaults (OTEL_SERVICE_NAME → fieldRef on component label = "flagd"),
    # so we don't override env here.
    sidecarContainers:
      - name: flagd-ui
        useDefault:
          env: true
        service:
          port: 4000
        env:
          - name: FLAGD_METRICS_EXPORTER
            value: otel
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://$(OTEL_COLLECTOR_NAME):4318
          - name: FLAGD_UI_PORT
            value: "4000"
          - name: SECRET_KEY_BASE
            value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
        volumeMounts:
          - name: config-rw
            mountPath: /app/data

opentelemetry-collector:
  enabled: false

jaeger:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

opensearch:
  enabled: false

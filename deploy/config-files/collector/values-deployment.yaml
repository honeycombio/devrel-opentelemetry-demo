mode: deployment
nameOverride: cluster-collector
resources:
  limits:
    cpu: 1
    memory: 1Gi
presets:
  clusterMetrics:
    enabled: true
  kubernetesEvents:
    enabled: true
image:
  repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib"
config:
  receivers:
    # clusterMetrics preset already declares a `prometheus` receiver
    # scraping the collector's own :8888 self-metrics as job
    # `opentelemetry-collector`. The chart merges this `config` block by
    # replacing lists wholesale (not appending), so that job must be
    # repeated here alongside the new one or self-metrics scraping breaks.
    prometheus:
      config:
        scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 10s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8888
          # external-dns (kube-system) exposes Prometheus metrics on its
          # `http` container port (7979), the same port used for
          # /healthz. Discover by pod label rather than hardcoding the
          # Helm-generated service name (external-dns-helm-<suffix>),
          # so this keeps working across reinstalls/replica changes.
          # Only needs pods list/watch RBAC, already granted by the
          # clusterMetrics preset's ClusterRole.
          - job_name: external-dns
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: keep
                regex: external-dns
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                action: keep
                regex: http
              - source_labels: [__meta_kubernetes_namespace]
                target_label: k8s.namespace.name
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: k8s.pod.name
  processors:
    # Stamps the OTel semconv resource attribute k8s.cluster.name (from the
    # Pulumi stack name via CLUSTER_NAME) onto every metric, so triggers and
    # queries can break down/filter by cluster once more instances exist.
    resource/cluster_name:
      attributes:
        - key: k8s.cluster.name
          value: ${env:CLUSTER_NAME}
          action: upsert
    transform/events:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - set(attributes["watch-type"], body["type"]) where IsMap(body) and body["type"] != nil

            - merge_maps(attributes, body, "upsert") where IsMap(body) and body["object"] == nil
            - merge_maps(attributes, body["object"], "upsert") where IsMap(body) and body["object"] != nil

            - merge_maps(attributes, attributes[ "metadata"], "upsert") where IsMap(attributes[ "metadata"])
            - set(attributes["k8s.pod.name"], attributes["regarding"]["name"]) where attributes["regarding"]["kind"] == "Pod"
            - set(attributes["k8s.node.name"], attributes["regarding"]["name"]) where attributes["regarding"]["kind"] == "Node"
            - set(attributes["k8s.job.name"], attributes["regarding"]["name"]) where attributes["regarding"]["kind"] == "Job"
            - set(attributes["k8s.cronjob.name"], attributes["regarding"]["name"]) where attributes["regarding"]["kind"] == "CronJob"
            - set(attributes["k8s.namespace.name"], attributes["regarding"]["namespace"]) where attributes["regarding"]["kind"] == "Pod" or attributes["regarding"]["kind"] == "Job" or attributes["regarding"]["kind"] == "CronJob"

            - set(severity_text, attributes["type"]) where attributes["type"] == "Normal" or attributes["type"] == "Warning"
            - set(severity_number, SEVERITY_NUMBER_INFO) where attributes["type"] == "Normal"
            - set(severity_number, SEVERITY_NUMBER_WARN) where attributes["type"] == "Warning"
  exporters:
    otlp/refinery:
      endpoint: ${REFINERY_ENDPOINT}
      tls:
        insecure: true
      headers:
        x-honeycomb-team: ${HONEYCOMB_INGEST_KEY}
    otlp/honeycomb:
      endpoint: api.honeycomb.io:443
      headers:
        x-honeycomb-team: ${env:HONEYCOMB_INGEST_KEY}
    otlp/logging-dogfood:
      endpoint: api-dogfood.honeycomb.io:443
      headers:
        x-honeycomb-team: ${env:HONEYCOMB_API_KEY_DOGFOOD}
        x-honeycomb-dataset: "k8s-events"

    otlp/metrics-dogfood:
      endpoint: "api-dogfood.honeycomb.io:443"
      headers:
        "x-honeycomb-team": "${env:HONEYCOMB_API_KEY_DOGFOOD}"
        "x-honeycomb-dataset": "k8s-metrics"

    otlp/logging-island-of-misfit-toys:
      endpoint: api.honeycomb.io:443
      headers:
        x-honeycomb-team: ${env:HONEYCOMB_API_KEY_ISLAND_OF_MISFIT_TOYS}
        x-honeycomb-dataset: "k8s-events"

    otlp/metrics-island-of-misfit-toys:
      endpoint: "api.honeycomb.io:443"
      headers:
        "x-honeycomb-team": "${env:HONEYCOMB_API_KEY_ISLAND_OF_MISFIT_TOYS}"
        "x-honeycomb-dataset": "k8s-metrics"

    otlp/logging-dogfood-island-of-misfit-toys:
      endpoint: api-dogfood.honeycomb.io:443
      headers:
        x-honeycomb-team: ${env:HONEYCOMB_API_KEY_DOGFOOD_ISLAND_OF_MISFIT_TOYS}
        x-honeycomb-dataset: "k8s-events"

    otlp/metrics-dogfood-island-of-misfit-toys:
      endpoint: "api-dogfood.honeycomb.io:443"
      headers:
        "x-honeycomb-team": "${env:HONEYCOMB_API_KEY_DOGFOOD_ISLAND_OF_MISFIT_TOYS}"
        "x-honeycomb-dataset": "k8s-metrics"

  extensions:
    # Reports this collector's health/effective config/available components
    # to opamp-server (see src/opamp-server), viewable at /opamp/ through the
    # frontend proxy. Wired to the cluster-collector (one per release) rather
    # than the daemonset agents, so the OpAMP UI shows one entry per
    # developer namespace instead of one per node.
    opamp:
      server:
        ws:
          endpoint: ws://opamp-server:4320/v1/opamp
      instance_uid: 00000000-0000-7000-8000-000000000001
      capabilities:
        reports_effective_config: true
        reports_health: true
        reports_available_components: true
      agent_description:
        include_resource_attributes: true
        non_identifying_attributes:
          demo.collector.role: gateway

  service:
    # Chart default is [health_check]; this list replaces wholesale rather
    # than merging, so health_check must be repeated alongside opamp.
    extensions:
      - health_check
      - opamp
    pipelines:
      metrics:
        exporters:
          - otlp/honeycomb
          - otlp/metrics-dogfood
          - otlp/metrics-island-of-misfit-toys
          - otlp/metrics-dogfood-island-of-misfit-toys
        # clusterMetrics preset's base metrics pipeline already has
        # processors: [memory_limiter, batch] (confirmed via the deployed
        # collector's rendered config) — this chart's merge replaces lists
        # wholesale, so both must be repeated here alongside the new one.
        processors:
          - memory_limiter
          - resource/cluster_name
          - batch
      logs:
        processors:
          - memory_limiter
          - transform/events
          - batch
        exporters:
          - otlp/refinery
          - otlp/logging-dogfood
          - otlp/logging-island-of-misfit-toys
          - otlp/logging-dogfood-island-of-misfit-toys

clusterRole:
  create: true
  rules:
    - apiGroups: 
        - ""
      resources:
        - nodes/proxy
      verbs:
        - get
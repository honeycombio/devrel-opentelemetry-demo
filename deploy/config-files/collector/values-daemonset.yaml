mode: daemonset

presets:
  kubeletMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true
  logsCollection:
    enabled: true
    includeCollectorLogs: false
podAnnotations:
  resource.opentelemetry.io/service.name: otel-collector
image:
  repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib"

service:
  enabled: true

config:
  receivers:
    jaeger: null
    zipkin: null
    kubeletstats:
      insecure_skip_verify: true
      collection_interval: 30s
      metric_groups:
        - node
        - pod
      metrics:
        k8s.node.uptime:
          enabled: true
        k8s.pod.uptime:
          enabled: true
        k8s.pod.cpu_limit_utilization:
          enabled: true
        k8s.pod.cpu_request_utilization:
          enabled: true
        k8s.pod.memory_limit_utilization:
          enabled: true
        k8s.pod.memory_request_utilization:
          enabled: true
    otlp:
      protocols:
        grpc:
        http:
          cors:
            allowed_origins:
              - http://*
              - https://*
          endpoint: 0.0.0.0:4318
    filelog:
      include:
        - /var/log/pods/${env:NAMESPACE}_*/*/*.log
      operators:
        # The helm logsCollection preset injects the container parser; we
        # need to redeclare it here because providing operators replaces
        # the preset's chain, then add recombine for accounting.
        - id: container-parser
          type: container
          max_log_size: 102400
        # Microsoft.Extensions.Logging.Console writes the category prefix
        # (`info: ...`) and each line of the message as separate stdout
        # lines, which the container parser turns into separate records.
        # Stitch them back together for our .NET services. The container
        # parser writes k8s.container.name to *resource* (not log) attributes,
        # so this predicate must use resource[...] — using attributes[...]
        # silently never matches, leaving every line as its own record.
        - type: recombine
          if: 'resource["k8s.container.name"] == "accounting" or resource["k8s.container.name"] == "cart"'
          combine_field: body
          combine_with: "\n"
          is_first_entry: 'body matches "^(trce|dbug|info|warn|fail|crit):"'
          source_identifier: attributes["log.file.path"]
          max_log_size: 102400
  processors:
    # Stamps the OTel semconv resource attribute k8s.cluster.name (from the
    # Pulumi stack name via CLUSTER_NAME) onto every log record, covering both
    # pod stdout (filelog) and logs received over OTLP.
    resource/cluster_name:
      attributes:
        - key: k8s.cluster.name
          value: ${env:CLUSTER_NAME}
          action: upsert
    # Envoy's OpenTelemetry tracer emits its own legacy tag names and cannot emit
    # the stable HTTP semantic conventions yet:
    # https://github.com/envoyproxy/envoy/issues/30821
    transform/envoy_http_semconv:
      error_mode: ignore
      trace_statements:
        - context: span
          conditions:
            - instrumentation_scope.name == "envoy"
          statements:
            # Known methods from the HTTP semconv; anything else becomes _OTHER.
            - set(attributes["http.request.method"], attributes["http.method"]) where IsMatch(attributes["http.method"], "^(CONNECT|DELETE|GET|HEAD|OPTIONS|PATCH|POST|PUT|TRACE)$")
            - set(attributes["http.request.method"], "_OTHER") where attributes["http.method"] != nil and attributes["http.request.method"] == nil
            - set(attributes["http.request.method_original"], attributes["http.method"]) where attributes["http.request.method"] == "_OTHER"
            - set(attributes["http.response.status_code"], Int(attributes["http.status_code"])) where attributes["http.status_code"] != nil and attributes["http.status_code"] != "0"
            - set(attributes["error.type"], attributes["http.status_code"]) where attributes["error"] == "true" and attributes["http.status_code"] != nil and attributes["http.status_code"] != "0"
            - set(attributes["error.type"], "_OTHER") where attributes["error"] == "true" and attributes["error.type"] == nil
            - set(attributes["url.full"], attributes["http.url"]) where attributes["http.url"] != nil
            - set(cache["url"], URL(attributes["http.url"])) where attributes["http.url"] != nil and kind == SPAN_KIND_SERVER
            - set(attributes["url.scheme"], cache["url"]["url.scheme"]) where cache["url"]["url.scheme"] != nil
            - set(attributes["url.path"], cache["url"]["url.path"]) where cache["url"]["url.path"] != nil
            - set(attributes["url.query"], cache["url"]["url.query"]) where cache["url"]["url.query"] != nil and cache["url"]["url.query"] != ""
            - set(attributes["server.address"], cache["url"]["url.domain"]) where cache["url"]["url.domain"] != nil
            - set(attributes["server.port"], cache["url"]["url.port"]) where cache["url"]["url.port"] != nil
            - set(attributes["user_agent.original"], attributes["user_agent"]) where attributes["user_agent"] != nil
            - set(attributes["http.request.body.size"], Int(attributes["request_size"])) where attributes["request_size"] != nil
            - set(attributes["http.response.body.size"], Int(attributes["response_size"])) where attributes["response_size"] != nil
            - set(attributes["http.request.resend_count"], Int(attributes["retry.count"])) where attributes["retry.count"] != nil and attributes["retry.count"] != "0"
            # Splits "HTTP/1.1" into the protocol version after the slash.
            - set(attributes["network.protocol.name"], "http") where IsMatch(attributes["http.protocol"], "^HTTP/")
            - set(attributes["network.protocol.version"], ExtractPatterns(attributes["http.protocol"], "^HTTP/(?P<version>.+)$")["version"]) where IsMatch(attributes["http.protocol"], "^HTTP/")
            # Splits "host:port"; a value without a port is used as the address.
            - set(cache["peer"], ExtractPatterns(attributes["peer.address"], "^(?P<address>[^:]+):(?P<port>[0-9]+)$")) where IsMatch(attributes["peer.address"], "^[^:]+:[0-9]+$")
            - set(attributes["network.peer.address"], cache["peer"]["address"]) where cache["peer"]["address"] != nil
            - set(attributes["network.peer.port"], Int(cache["peer"]["port"])) where cache["peer"]["port"] != nil
            - set(attributes["network.peer.address"], attributes["peer.address"]) where attributes["peer.address"] != nil and attributes["network.peer.address"] == nil
            # Drops the legacy names mapped above.
            - delete_matching_keys(attributes, "^(http\\.(method|status_code|url|protocol)|user_agent|peer\\.address|request_size|response_size|retry\\.count)$")

    transform/service_names:
      error_mode: ignore
      log_statements:
        - context: resource
          statements:
            - set(attributes["service.name"], attributes["app.kubernetes.io/component"]) where attributes["service.name"] == nil and attributes["app.kubernetes.io/component"] != nil
            - set(attributes["service.name"], "api-gateway") where attributes["service.name"] == "frontend"
            - set(attributes["service.name"], "ingress-gateway") where attributes["service.name"] == "frontendproxy"
      metric_statements:
        - context: resource
          statements:
            - set(attributes["service.name"], "api-gateway") where attributes["service.name"] == "frontend"
            - set(attributes["service.name"], "ingress-gateway") where attributes["service.name"] == "frontendproxy"
      trace_statements:
        - context: resource
          statements:
            - set(attributes["service.name"], "api-gateway") where attributes["service.name"] == "frontend"
            - set(attributes["service.name"], "ingress-gateway") where attributes["service.name"] == "frontendproxy"
    transform/attribution:
      log_statements:
        - context: resource
          statements:
            - set(attributes["collector.name"], "daemonset-collector")
      metric_statements:
        - context: resource
          statements:
            - set(attributes["collector.name"], "daemonset-collector")
      trace_statements:
        - context: resource
          statements:
            - set(attributes["collector.name"], "daemonset-collector")
    transform/access_log_severity:
      error_mode: ignore
      log_statements:
        - context: log
          conditions:
            - resource.attributes["service.name"] == "access-logs"
            - attributes["http.response.status_code"] != nil
            - IsString(attributes["http.response.status_code"]) == true
          statements:
            - set(cache["status_code"], Int(attributes["http.response.status_code"]))
            - set(severity_number, 17) where cache["status_code"] >= 500
            - set(severity_number, 13) where cache["status_code"] >= 400 and cache["status_code"] < 500
            - set(severity_number, 9) where cache["status_code"] < 400
            - set(severity_text, "ERROR") where cache["status_code"] >= 500
            - set(severity_text, "WARN") where cache["status_code"] >= 400 and cache["status_code"] < 500
            - set(severity_text, "INFO") where cache["status_code"] < 400
            - set(attributes["demo.telemetry.transform.access_log_severity"], "v4")
    transform/filelog_severity:
      error_mode: ignore
      log_statements:
        - context: log
          conditions:
            - attributes["log.severity"] != nil
          statements:
            - set(severity_text, "ERROR") where attributes["log.severity"] == "error"
            - set(severity_number, 17) where attributes["log.severity"] == "error"
            - set(severity_text, "WARN") where attributes["log.severity"] == "warn"
            - set(severity_number, 13) where attributes["log.severity"] == "warn"
            - set(severity_text, "INFO") where attributes["log.severity"] == "info"
            - set(severity_number, 9) where attributes["log.severity"] == "info"
            - set(attributes["collector.transform.filelog_severity"], "v1")
    transform/pino_trace_fields:
      error_mode: ignore
      log_statements:
        - context: log
          conditions:
            - attributes["trace_id"] != nil and attributes["trace.trace_id"] == nil
          statements:
            - set(attributes["trace.trace_id"], attributes["trace_id"])
            - set(attributes["trace.parent_id"], attributes["span_id"])
            - set(attributes["meta.annotation_type"], "span_event")
    transform/parse_json_body:
      error_mode: ignore
      log_statements:
        - context: log
          conditions:
            - body != nil and IsString(body) and HasPrefix(body, "{")
          statements:
            - set(cache, ParseJSON(body))
            - flatten(cache, "")
            - merge_maps(attributes, cache, "upsert")
        - context: log
          statements:
            - set(resource.attributes["service.name"], "api-gateway") where resource.attributes["k8s.container.name"] == "frontend"

    # Drain log clustering — derives a template (e.g. "user <*> logged in
    # from <*>") from each log body and writes it to log.record.template.
    # Defaults are fine for the heterogeneous mix of services here; tune
    # tree_depth/merge_threshold later if templates collide or fragment.
    drain: {}

    filter/json_body_only:
      error_mode: ignore
      logs:
        log_record:
          - HasPrefix(body, "{") == false
          - ContainsValue(body, "\u0000") == false

    filter/warn_or_below:
        error_mode: ignore
        logs:
            log_record:
                - severity_number < SEVERITY_NUMBER_WARN

    # Drop low-signal flagd feature-flag evaluation spans from all traces:
    # client-side `/flagd.evaluation.v1.Service/*` invocations and the
    # server-side `resolveBoolean` / jsonEvaluator internals inside flagd.
    filter/drop_flagd_spans:
        error_mode: ignore
        traces:
            span:
                - attributes["rpc.service"] == "flagd.evaluation.v1.Service"
                - resource.attributes["service.name"] == "flagd"
                # cart is .NET: Grpc.Net.Client rides on HttpClient, so each
                # flagd call also emits a System.Net.Http child span carrying
                # no rpc.* attributes. Without this it survives its dropped
                # parent and shows up as an orphan. See CLAUDE.md.
                - attributes["server.address"] == "flagd"

    # Keep only spans worth evaluating: store-chat's per-turn supervisor
    # invocation. Same drop-everything-else pattern.
    filter/keep_eval_anchors:
        error_mode: ignore
        traces:
            span:
                - 'not (resource.attributes["service.name"] == "store-chat" and name == "invoke_agent supervisor")'

    # Keep only flagd-ui's "Flag changed:" log records for the markers
    # pipeline. flagd-ui's Storage GenServer logs that string via
    # Logger.info on each flag change; filelog scrapes container stdout.
    filter/keep_flag_changes:
        error_mode: ignore
        logs:
            log_record:
                - 'not (IsString(body) and IsMatch(body, "Flag changed: "))'

    # Extract just the "Flag changed: <key> (<old> → <new>) [<source>]" line
    # into marker.message. Phoenix's Logger flushes batched entries as a
    # single stdout write, so container-parser produces one log record whose
    # body is multiple newline-separated lines. Without this regex extraction
    # the marker message becomes a wall of unrelated request/response noise.
    transform/marker_message:
        error_mode: ignore
        log_statements:
            - context: log
              conditions:
                  - 'IsString(body) and IsMatch(body, "Flag changed: ")'
              statements:
                  - 'set(attributes["marker.message"], ExtractPatterns(body, "(?P<msg>Flag changed: [^\n]+)")["msg"])'

    # ── GenAI span shaping ──────────────────────────────────────────────
    # Strands (storechat) emits GenAI telemetry that needs
    # shaping before it's useful in Honeycomb. Split into three small
    # processors so each job is self-contained:
    #   1. genai_copy_events_to_span      — promote Strands' span-EVENT
    #      attributes onto the parent span. Pure copy, no math.
    #   2. genai_canonicalize_token_names — rename cache attributes to the
    #      semconv 1.41 canonical dotted form (covers both sources).
    #   3. genai_fix_token_counts         — reconstruct semconv-correct token
    #      counts (input_tokens must include cached tokens).

    # 1. COPY TO SPAN — Strands emits messages + usage on a
    #    `gen_ai.client.inference.operation.details` span event; copy each
    #    attribute up to the span verbatim so downstream reads them as span
    #    attributes.
    transform/genai_copy_events_to_span:
        error_mode: ignore
        trace_statements:
            - context: spanevent
              conditions:
                  - IsMatch(name, "^gen_ai\\..*")
              statements:
                  - set(span.attributes["gen_ai.input.messages"], attributes["gen_ai.input.messages"]) where attributes["gen_ai.input.messages"] != nil
                  - set(span.attributes["gen_ai.output.messages"], attributes["gen_ai.output.messages"]) where attributes["gen_ai.output.messages"] != nil
                  - set(span.attributes["gen_ai.system_instructions"], attributes["gen_ai.system_instructions"]) where attributes["gen_ai.system_instructions"] != nil
                  - set(span.attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"]) where attributes["gen_ai.usage.input_tokens"] != nil
                  - set(span.attributes["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.output_tokens"]) where attributes["gen_ai.usage.output_tokens"] != nil
                  - set(span.attributes["gen_ai.usage.total_tokens"], attributes["gen_ai.usage.total_tokens"]) where attributes["gen_ai.usage.total_tokens"] != nil
                  # Strands reports cache tokens in the older underscore shape.
                  # Copy verbatim — (2) canonicalises the names.
                  - set(span.attributes["gen_ai.usage.cache_read_input_tokens"], attributes["gen_ai.usage.cache_read_input_tokens"]) where attributes["gen_ai.usage.cache_read_input_tokens"] != nil
                  - set(span.attributes["gen_ai.usage.cache_write_input_tokens"], attributes["gen_ai.usage.cache_write_input_tokens"]) where attributes["gen_ai.usage.cache_write_input_tokens"] != nil
                  - set(span.attributes["gen_ai.response.finish_reasons"], attributes["gen_ai.response.finish_reasons"]) where attributes["gen_ai.response.finish_reasons"] != nil
                  - set(span.attributes["gen_ai.request.model"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
                  - set(span.attributes["gen_ai.operation.name"], attributes["gen_ai.operation.name"]) where attributes["gen_ai.operation.name"] != nil

    # 2. CANONICALISE TOKEN NAMES — rename cache attributes to the semconv 1.41
    #    canonical dotted form. Runs at span level (not in the copy step)
    #    so the rename sees both Strands' promoted underscore names and any
    #    set directly on the span.
    transform/genai_canonicalize_token_names:
        error_mode: ignore
        trace_statements:
            - context: span
              conditions:
                  - attributes["gen_ai.usage.input_tokens"] != nil
              statements:
                  # Strands -> underscore (cache_read_input_tokens /
                  # cache_write_input_tokens). Targets: cache_read.input_tokens and
                  # cache_creation.input_tokens (the registered write attribute).
                  - set(attributes["gen_ai.usage.cache_read.input_tokens"], attributes["gen_ai.usage.cache_read_input_tokens"]) where attributes["gen_ai.usage.cache_read_input_tokens"] != nil and attributes["gen_ai.usage.cache_read.input_tokens"] == nil
                  - set(attributes["gen_ai.usage.cache_creation.input_tokens"], attributes["gen_ai.usage.cache_write_input_tokens"]) where attributes["gen_ai.usage.cache_write_input_tokens"] != nil and attributes["gen_ai.usage.cache_creation.input_tokens"] == nil

    # 3. FIX TOKEN COUNTS — runs on span attributes only, after names are
    #    canonical. Covers Strands (events).
    #
    #    ASSUMPTION: our SDKs report gen_ai.usage.input_tokens as the UNCACHED
    #    portion only (raw Bedrock inputTokens), with cache read/creation counted
    #    separately. Verified for Strands. If an SDK is ever
    #    upgraded to emit semconv-compliant input_tokens (already inclusive of
    #    cached tokens), revisit — the additive step below would double-count.
    transform/genai_fix_token_counts:
        error_mode: ignore
        trace_statements:
            - context: span
              conditions:
                  - attributes["gen_ai.usage.input_tokens"] != nil
              statements:
                  # Roll both cache components into input_tokens so it reflects the
                  # full prompt size. Semconv 1.41: cache_read.input_tokens and
                  # cache_creation.input_tokens SHOULD be included in input_tokens.
                  - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"] + attributes["gen_ai.usage.cache_read.input_tokens"]) where attributes["gen_ai.usage.cache_read.input_tokens"] != nil
                  - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"] + attributes["gen_ai.usage.cache_creation.input_tokens"]) where attributes["gen_ai.usage.cache_creation.input_tokens"] != nil
                  # demo.* convenience metric: input tokens NOT served from cache
                  # — i.e. processed fresh this turn (uncached + newly cached),
                  # which is the full input minus what was read from cache. Newly
                  # cached content still costs (Bedrock bills cache writes), so it
                  # belongs here, not with the free cache reads.
                  - set(attributes["demo.gen_ai.usage.uncached_input_tokens"], attributes["gen_ai.usage.input_tokens"] - attributes["gen_ai.usage.cache_read.input_tokens"]) where attributes["gen_ai.usage.cache_read.input_tokens"] != nil
                  - set(attributes["demo.gen_ai.usage.uncached_input_tokens"], attributes["gen_ai.usage.input_tokens"]) where attributes["gen_ai.usage.cache_read.input_tokens"] == nil

    # Promote `exception.type` from the OTel `exception` span event onto
    # the span itself as `error.type`, per the gen_ai/general-error
    # semconv. SDKs like Strands call record_exception() (which writes
    # the event) but don't set the span-level error.type — without this
    # transform, queries/SLOs/alerts on error.type miss tool and LLM
    # failures. Skipped if the SDK already populated error.type.
    #
    # `exception.type` is the fully-qualified name (e.g.
    # `grpc._channel._InactiveRpcError`); we keep just the last
    # `.`-segment so `error.type` stays low-cardinality and stable
    # across library version bumps that reshuffle module paths.
    transform/exception_type_to_error_type:
        error_mode: ignore
        trace_statements:
            - context: spanevent
              conditions:
                  - name == "exception"
              statements:
                  - set(span.attributes["error.type"], ExtractPatterns(attributes["exception.type"], "(?P<class>[^.]+)$")["class"]) where attributes["exception.type"] != nil and span.attributes["error.type"] == nil

    # Artificially inflates span volume in Honeycomb by claiming each trace
    # was sampled, without dropping anything. Writes an OTel sampling
    # threshold (tracestate ot=th, adjusted count = 2^56 / (2^56 - th)) per
    # trace, picked from the first trace ID hex digit (independent of the
    # randomness bytes at the end of the ID). The 16 rates average 15.
    transform/inflate_sample_rate:
        error_mode: ignore
        trace_statements:
            - context: span
              statements:
                  - set(cache["bucket"], Substring(span.trace_id.string, 0, 1))
                  - set(span.trace_state["ot"], "th:0") where cache["bucket"] == "0"               # 1
                  - set(span.trace_state["ot"], "th:8") where cache["bucket"] == "1"               # 2
                  - set(span.trace_state["ot"], "th:aaaaaaaaaaaaab") where cache["bucket"] == "2"  # 3
                  - set(span.trace_state["ot"], "th:cccccccccccccd") where cache["bucket"] == "3"  # 5
                  - set(span.trace_state["ot"], "th:cccccccccccccd") where cache["bucket"] == "4"  # 5
                  - set(span.trace_state["ot"], "th:e") where cache["bucket"] == "5"               # 8
                  - set(span.trace_state["ot"], "th:e6666666666667") where cache["bucket"] == "6"  # 10
                  - set(span.trace_state["ot"], "th:eaaaaaaaaaaaab") where cache["bucket"] == "7"  # 12
                  - set(span.trace_state["ot"], "th:eeeeeeeeeeeeef") where cache["bucket"] == "8"  # 15
                  - set(span.trace_state["ot"], "th:f") where cache["bucket"] == "9"               # 16
                  - set(span.trace_state["ot"], "th:f1c71c71c71c72") where cache["bucket"] == "a"  # 18
                  - set(span.trace_state["ot"], "th:f3333333333334") where cache["bucket"] == "b"  # 20
                  - set(span.trace_state["ot"], "th:f5555555555556") where cache["bucket"] == "c"  # 24
                  - set(span.trace_state["ot"], "th:f6db6db6db6db7") where cache["bucket"] == "d"  # 28
                  - set(span.trace_state["ot"], "th:f83e0f83e0f83f") where cache["bucket"] == "e"  # 33
                  - set(span.trace_state["ot"], "th:f999999999999a") where cache["bucket"] == "f"  # 40
  exporters:
    otlp/refinery:
      endpoint: ${REFINERY_ENDPOINT}
      tls:
        insecure: true
      headers:
        x-honeycomb-team: ${HONEYCOMB_INGEST_KEY}
    otlp/honeycomb:
      endpoint: api.honeycomb.io:443
      headers:
        x-honeycomb-team: ${HONEYCOMB_INGEST_KEY}
    otlp/bindplane:
      endpoint: bindplane-node-agent.bindplane-agent:4317
      tls:
        insecure: true
    otlp/traces-dogfood:
      endpoint: api-dogfood.honeycomb.io:443
      headers:
        x-honeycomb-team: ${HONEYCOMB_API_KEY_DOGFOOD}

    otlp/metrics-dogfood:
      endpoint: api-dogfood.honeycomb.io:443
      headers:
        x-honeycomb-team: ${HONEYCOMB_API_KEY_DOGFOOD}
        x-honeycomb-dataset: service-metrics

    otlp/logging-dogfood:
      endpoint: api-dogfood.honeycomb.io:443
      headers:
        x-honeycomb-team: ${HONEYCOMB_API_KEY_DOGFOOD}
        x-honeycomb-dataset: service-logs

    otlp/traces-island-of-misfit-toys:
      endpoint: api.honeycomb.io:443
      headers:
        x-honeycomb-team: ${HONEYCOMB_API_KEY_ISLAND_OF_MISFIT_TOYS}

    otlp/metrics-island-of-misfit-toys:
      endpoint: api.honeycomb.io:443
      headers:
        x-honeycomb-team: ${HONEYCOMB_API_KEY_ISLAND_OF_MISFIT_TOYS}
        x-honeycomb-dataset: service-metrics

    otlp/logging-island-of-misfit-toys:
      endpoint: api.honeycomb.io:443
      headers:
        x-honeycomb-team: ${HONEYCOMB_API_KEY_ISLAND_OF_MISFIT_TOYS}
        x-honeycomb-dataset: service-logs

    # Ships eval-anchor spans (one per chatbot turn) to the llm-evals
    # service in OTLP JSON. The consumer parses these spans and runs
    # Bias/Hallucination/Relevance scorers — no producer-side
    # publish_eval calls needed.
    kafka/llm-evals:
      brokers:
        - kafka:9092
      # Use the trace ID as the kafka message key. The default
      # `record_partitioner: sticky_key` with no key would keep bursts
      # from one collector batch on the same partition, so
      # partitionsConsumedConcurrently in the llm-evals consumer
      # wouldn't actually parallelise. With trace-id keys, anchor
      # spans (one per chat turn ⇒ unique trace ID) hash across
      # partitions evenly while spans of the same trace stay on one
      # partition — preserving per-message transactional logic.
      # NOTE: top-level key, not nested under `traces:`.
      partition_traces_by_id: true
      # As of kafkaexporter v0.151+, topic/encoding live under per-signal
      # subkeys. This pipeline ships traces, so configure under `traces:`.
      traces:
        topic: llm-evals-spans
        encoding: otlp_json
      producer:
        max_message_bytes: 10000000

    # Posts an environment-level Honeycomb marker per flagd-ui flag-change
    # log record (the line transform/marker_message extracted into
    # marker.message). Registered in ocb-config.yaml so otelcol-dev includes
    # honeycombmarkerexporter.
    honeycombmarker:
      api_key: ${HONEYCOMB_MARKERS_API_KEY}
      markers:
        - type: feature-flag-change
          message_key: marker.message
          rules:
            log_conditions:
              - 'IsString(body) and IsMatch(body, "Flag changed: ")'

  service:
    pipelines:
      metrics:
        exporters:
          - otlp/honeycomb
          - otlp/metrics-dogfood
          - otlp/metrics-island-of-misfit-toys
        processors:
          - transform/service_names

      logs:
        exporters:
          - otlp/refinery
          - otlp/logging-dogfood
          - otlp/logging-island-of-misfit-toys
          - otlp/bindplane
        processors:
          - transform/parse_json_body
          - transform/service_names
          - transform/access_log_severity
          - transform/filelog_severity
          - transform/pino_trace_fields
          - transform/attribution
          - resource/cluster_name
          - drain

      traces:
        exporters:
          - otlp/refinery
          - otlp/traces-dogfood
          - otlp/traces-island-of-misfit-toys
          - otlp/bindplane
        processors:
          - filter/drop_flagd_spans
          - transform/genai_copy_events_to_span
          - transform/genai_canonicalize_token_names
          - transform/genai_fix_token_counts
          - transform/envoy_http_semconv
          - transform/exception_type_to_error_type
          - transform/service_names
          - transform/attribution
          - transform/inflate_sample_rate

      # Eval anchor pipeline. Pushes one span per chatbot turn to Kafka;
      # the llm-evals service consumes and runs Bias/Hallucination/Relevance.
      # genai_copy_events_to_span runs first to promote Strands-style event
      # attributes onto the span — without that, invoke_agent spans arrive at
      # the consumer with gen_ai.input.messages still on the span event and the
      # consumer skips them. fix_token_counts keeps the eval anchor's token
      # counts consistent with the main traces pipeline.
      traces/evals:
        receivers: [otlp]
        processors: [transform/genai_copy_events_to_span, transform/genai_canonicalize_token_names, transform/genai_fix_token_counts, filter/keep_eval_anchors]
        exporters: [kafka/llm-evals]

      # Isolated pipeline that publishes a Honeycomb marker per
      # flagd-ui flag-change log record. Receives a separate copy of
      # filelog data so it doesn't interfere with the main logs pipeline.
      logs/markers:
        receivers:
          - filelog
        processors:
          - filter/keep_flag_changes
          - transform/marker_message
        exporters:
          - honeycombmarker

clusterRole:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - nodes/proxy
      verbs:
        - get

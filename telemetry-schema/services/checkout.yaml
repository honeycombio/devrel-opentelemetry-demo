file_format: definition/2
attribute_groups:
  - id: service.checkout
    visibility: public
    brief: Checkout service attributes
    stability: stable
    attributes:
      - ref: user_agent.synthetic.type
      - ref: user.id
      - ref: user.email
      - ref: user.hash
      - ref: demo.user_context.selected_currency
      - ref: demo.payment.transaction.id
      - ref: demo.payment.card_number
      - ref: demo.payment.card_cvv
      - ref: demo.shipping.tracking.id
      - ref: demo.order.id
      - ref: demo.shipping.amount
      - ref: demo.order.amount
      - ref: demo.order.items.count
      - ref: demo.cart.items.count
      - ref: demo.user_context.city
      - ref: demo.payment.strategy
      - ref: demo.product.id
      - ref: demo.product.quantity
      - ref: demo.promo.code
      - ref: demo.promo.valid
      - ref: demo.promo.discount_percent
      - ref: demo.promo.validation_ms
      - ref: demo.promo.orders_scanned
      - ref: demo.promo.items_scanned

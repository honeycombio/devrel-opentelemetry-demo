########################
#
# This is the configuration for the Otel demo deployed to {you}-local, not the main demo.
#
########################
default:
  image:
    pullPolicy: Always
  replicas: 1
  # List of environment variables applied to all components

components:
  accounting:
    service:
      port: 5060
    resources:
      limits:
        memory: 200Mi
    envOverrides:
      - name: PAYMENT_ADDR
        value: payment:8080
      - name: ACCOUNTING_SERVICE_PORT
        value: "5060"
      - name: ASPNETCORE_URLS
        value: "http://*:5060"
      # Overrides the chart's own default (Database=otel, a db our schema
      # doesn't use) to match src/postgresql/init.sql -- upstream's unmodified
      # postgresql init script, which provisions astronomy_user/astronomy_db.
      # Kept as a fork amendment (src/postgresql/zz_fork_amendments.sql) rather
      # than editing init.sql, so it merges cleanly from upstream/main.
      - name: DB_CONNECTION_STRING
        value: "Host=postgresql;Username=astronomy_user;Password=astronomy_password;Database=astronomy_db"
  product-catalog:
    envOverrides:
      # Upstream's product-catalog now requires a Postgres-backed catalog
      # (main.go errors out at startup without this); the chart default
      # doesn't set it yet. Same astronomy_user/astronomy_db as accounting --
      # one Postgres instance, not two. lib/pq (Go) wants libpq keyword=value
      # syntax, not the semicolon-delimited form accounting's .NET/Npgsql uses.
      - name: DB_CONNECTION_STRING
        value: "host=postgresql user=astronomy_user password=astronomy_password dbname=astronomy_db sslmode=disable"
  shipping:
    envOverrides:
      # Upstream's shipping now uses open-feature-flagd to read feature flags
      # (panics at startup without a reachable provider); the pinned chart
      # (0.39.0) doesn't set these for shipping yet, so it defaults to
      # localhost, which isn't the flagd service.
      - name: FLAGD_HOST
        value: "flagd"
      - name: FLAGD_PORT
        value: "8013"
  load-generator:
    replicas: 1
    envOverrides:
      # Agent (Bedrock-hitting) loadgen is off for locals by default to avoid
      # multiple developer namespaces hammering the shared AWS account. The
      # value is templated from ./run's --agent-load flag; empty = off.
      - name: AGENT_LOAD_ENABLED
        value: ""
      # xk6-otel's own SDK (Go runtime metrics, and the Tracer used by
      # script.js) uses the http OTLP exporters, so it needs the collector's
      # HTTP receiver (4318), not the chart-wide default of 4317 (grpc-only).
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector:4318"
      # k6's own built-in `--out opentelemetry` (test-run metrics) is a
      # separate exporter from xk6-otel and ignores OTEL_EXPORTER_OTLP_*;
      # it needs its own K6_OTEL_* vars or it falls back to localhost:4317.
      - name: K6_OTEL_EXPORTER_PROTOCOL
        value: "grpc"
      - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
        value: "otel-collector:4317"
      - name: K6_OTEL_GRPC_EXPORTER_INSECURE
        value: "true"
  frontend:
    replicas: 1
    envOverrides:
      - name: ACCOUNTING_ADDR
        value: accounting:5060
      - name: ENV_PLATFORM
        value: local
  frontend-proxy:
    envOverrides:
      # Needed until the demo helm chart updates to include it.
      - name: ENVOY_ADDR
        value: 0.0.0.0
      - name: STORE_CHAT_HOST
        value: "store-chat"
      - name: STORE_CHAT_PORT
        value: "8080"
      - name: CHATBOT_HOST
        value: "chatbot"
      - name: CHATBOT_PORT
        value: "7860"
      - name: OPAMP_SERVER_HOST
        value: "opamp-server"
      - name: OPAMP_SERVER_UI_PORT
        value: "4321"
      # /profiles/ (firepit) has no backing service deployed -- these are
      # upstream's own placeholder defaults, kept non-empty so envoy's
      # bootstrap validation doesn't crash-loop the whole proxy over one
      # dormant route (an empty socket_address fails hard at parse time; an
      # unresolvable-but-non-empty one just 503s if anyone actually hits it).
      - name: FIREPIT_HOST
        value: "firepit"
      - name: FIREPIT_PORT
        value: "8080"
      - name: LLM_EVALS_PORT
        value: "8088"
      - name: TELEMETRY_DOCS_HOST
        value: "telemetry-docs"
      - name: TELEMETRY_DOCS_PORT
        value: "8000"

opentelemetry-collector:
  enabled: true
  mode: daemonset
  image:
    pullPolicy: Always
  service:
    enabled: true
  presets:
    logsCollection:
      enabled: true
      includeCollectorLogs: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            cors:
              allowed_origins:
                - "*"
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/${env:NAMESPACE}_*/*/*.log
        operators:
          # The helm logsCollection preset injects the container parser; we
          # need to redeclare it here because providing operators replaces
          # the preset's chain, then add recombine for accounting.
          - id: container-parser
            type: container
            max_log_size: 102400
          # Microsoft.Extensions.Logging.Console writes the category prefix
          # (`info: ...`) and each line of the message as separate stdout
          # lines, which the container parser turns into separate records.
          # Stitch them back together for our .NET services. The container
          # parser writes k8s.container.name to *resource* (not log) attributes,
          # so this predicate must use resource[...] — using attributes[...]
          # silently never matches, leaving every line as its own record.
          - type: recombine
            if: 'resource["k8s.container.name"] == "accounting" or resource["k8s.container.name"] == "cart"'
            combine_field: body
            combine_with: "\n"
            is_first_entry: 'body matches "^(trce|dbug|info|warn|fail|crit):"'
            source_identifier: attributes["log.file.path"]
            max_log_size: 102400
    processors:
      transform/attribution:
        log_statements:
          - context: resource
            statements:
              - set(attributes["collector.name"], "daemonset-collector")
        metric_statements:
          - context: resource
            statements:
              - set(attributes["collector.name"], "daemonset-collector")
        trace_statements:
          - context: resource
            statements:
              - set(attributes["collector.name"], "daemonset-collector")
      k8sattributes:
        extract:
          annotations:
            - from: pod
              key_regex: (.*)
              tag_name: $$1
          labels:
            - from: pod
              key_regex: (.*)
              tag_name: $$1
      transform/access_log_severity:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - resource.attributes["service.name"] == "access-logs"
              - attributes["http.response.status_code"] != nil
              - IsString(attributes["http.response.status_code"]) == true
            statements:
              - set(cache["status_code"], Int(attributes["http.response.status_code"]))
              - set(severity_number, 17) where cache["status_code"] >= 500
              - set(severity_number, 13) where cache["status_code"] >= 400 and cache["status_code"] < 500
              - set(severity_number, 9) where cache["status_code"] < 400
              - set(severity_text, "ERROR") where cache["status_code"] >= 500
              - set(severity_text, "WARN") where cache["status_code"] >= 400 and cache["status_code"] < 500
              - set(severity_text, "INFO") where cache["status_code"] < 400
              - set(attributes["demo.telemetry.transform.access_log_severity"], "v4")
      transform/filelog_severity:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - attributes["log.severity"] != nil
            statements:
              - set(severity_text, "ERROR") where attributes["log.severity"] == "error"
              - set(severity_number, 17) where attributes["log.severity"] == "error"
              - set(severity_text, "WARN") where attributes["log.severity"] == "warn"
              - set(severity_number, 13) where attributes["log.severity"] == "warn"
              - set(severity_text, "INFO") where attributes["log.severity"] == "info"
              - set(severity_number, 9) where attributes["log.severity"] == "info"
              - set(attributes["collector.transform.filelog_severity"], "v1")
      transform/pino_trace_fields:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - attributes["trace_id"] != nil and attributes["trace.trace_id"] == nil
            statements:
              - set(attributes["trace.trace_id"], attributes["trace_id"])
              - set(attributes["trace.parent_id"], attributes["span_id"])
              - set(attributes["meta.annotation_type"], "span_event")
      # ── GenAI span shaping ──────────────────────────────────────────
      # Strands (storechat) emits GenAI telemetry that needs shaping before
      # it's useful in Honeycomb. agent (opentelemetry-instrumentation-
      # langchain) already sets these directly on the span using canonical
      # semconv 1.41 names, so steps 1-2 are no-ops for it -- it's only here
      # because the conditions below match on attribute shape, not
      # service.name. Split into three small processors so each job is
      # self-contained:
      #   1. genai_copy_events_to_span      — promote Strands' span-EVENT
      #      attributes onto the parent span. Pure copy, no math.
      #   2. genai_canonicalize_token_names — rename cache attributes to the
      #      semconv 1.41 canonical dotted form.
      #   3. genai_fix_token_counts         — reconstruct semconv-correct
      #      token counts (input_tokens must include cached tokens).

      # 1. COPY TO SPAN — Strands emits messages + usage on a
      #    `gen_ai.client.inference.operation.details` span event; copy each
      #    attribute up to the span verbatim. agent already sets these on
      #    the span, so it skips this step (handled by 2 + 3).
      transform/genai_copy_events_to_span:
        error_mode: ignore
        trace_statements:
          - context: spanevent
            conditions:
              - IsMatch(name, "^gen_ai\\..*")
            statements:
              - set(span.attributes["gen_ai.input.messages"], attributes["gen_ai.input.messages"]) where attributes["gen_ai.input.messages"] != nil
              - set(span.attributes["gen_ai.output.messages"], attributes["gen_ai.output.messages"]) where attributes["gen_ai.output.messages"] != nil
              - set(span.attributes["gen_ai.system_instructions"], attributes["gen_ai.system_instructions"]) where attributes["gen_ai.system_instructions"] != nil
              - set(span.attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"]) where attributes["gen_ai.usage.input_tokens"] != nil
              - set(span.attributes["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.output_tokens"]) where attributes["gen_ai.usage.output_tokens"] != nil
              - set(span.attributes["gen_ai.usage.total_tokens"], attributes["gen_ai.usage.total_tokens"]) where attributes["gen_ai.usage.total_tokens"] != nil
              # Strands reports cache tokens in the older underscore shape.
              # Copy verbatim — (2) canonicalises the names.
              - set(span.attributes["gen_ai.usage.cache_read_input_tokens"], attributes["gen_ai.usage.cache_read_input_tokens"]) where attributes["gen_ai.usage.cache_read_input_tokens"] != nil
              - set(span.attributes["gen_ai.usage.cache_write_input_tokens"], attributes["gen_ai.usage.cache_write_input_tokens"]) where attributes["gen_ai.usage.cache_write_input_tokens"] != nil
              - set(span.attributes["gen_ai.response.finish_reasons"], attributes["gen_ai.response.finish_reasons"]) where attributes["gen_ai.response.finish_reasons"] != nil
              - set(span.attributes["gen_ai.request.model"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              - set(span.attributes["gen_ai.operation.name"], attributes["gen_ai.operation.name"]) where attributes["gen_ai.operation.name"] != nil

      # 2. CANONICALISE TOKEN NAMES — EXPERIMENTAL: replaced the hand-rolled
      #    transform/genai_canonicalize_token_names with the upstream
      #    gen_ai_normalizer processor's user-defined-source rename table.
      #    Neither Strands nor agent's attribute names match the processor's
      #    *built-in* openinference/openllmetry sources (both already emit
      #    gen_ai.* names), so this only exercises the user-defined-source
      #    path, not the built-in normalization. remove_originals mirrors
      #    the old processor's rename-not-copy behavior.
      gen_ai_normalizer:
        sources:
          - name: demo_cache_token_names
            remove_originals: true
            mappings:
              gen_ai.usage.cache_read_input_tokens: gen_ai.usage.cache_read.input_tokens
              gen_ai.usage.cache_write_input_tokens: gen_ai.usage.cache_creation.input_tokens

      # 3. FIX TOKEN COUNTS — runs on span attributes only, after names are
      #    canonical. Covers Strands (events) and agent (native span attrs)
      #    alike in one span-context pass.
      #
      #    ASSUMPTION: our SDKs report gen_ai.usage.input_tokens as the
      #    UNCACHED portion only (raw Bedrock inputTokens), with cache
      #    read/creation counted separately. Verified for Strands. agent goes
      #    through a different SDK path (langchain_aws -> boto3 Bedrock
      #    Converse) hitting the same underlying Bedrock API, so this very
      #    likely holds, but it hasn't been directly confirmed with a live
      #    cache-hit trace -- check this against a real multi-turn agent
      #    conversation before trusting input_tokens/cost figures for the
      #    agent service. If an SDK is upgraded to emit semconv-compliant
      #    input_tokens (already inclusive of cached tokens), revisit — the
      #    additive step below would double-count.
      transform/genai_fix_token_counts:
        error_mode: ignore
        trace_statements:
          - context: span
            conditions:
              - attributes["gen_ai.usage.input_tokens"] != nil
            statements:
              # Roll both cache components into input_tokens so it reflects
              # the full prompt size. Semconv 1.41: cache_read.input_tokens
              # and cache_creation.input_tokens SHOULD be included in
              # input_tokens.
              - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"] + attributes["gen_ai.usage.cache_read.input_tokens"]) where attributes["gen_ai.usage.cache_read.input_tokens"] != nil
              - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"] + attributes["gen_ai.usage.cache_creation.input_tokens"]) where attributes["gen_ai.usage.cache_creation.input_tokens"] != nil
              # demo.* convenience metric: input tokens NOT served from cache
              # — processed fresh this turn (uncached + newly cached), i.e.
              # the full input minus what was read from cache.
              - set(attributes["demo.gen_ai.usage.uncached_input_tokens"], attributes["gen_ai.usage.input_tokens"] - attributes["gen_ai.usage.cache_read.input_tokens"]) where attributes["gen_ai.usage.cache_read.input_tokens"] != nil
              - set(attributes["demo.gen_ai.usage.uncached_input_tokens"], attributes["gen_ai.usage.input_tokens"]) where attributes["gen_ai.usage.cache_read.input_tokens"] == nil
      transform/service_names:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["app.kubernetes.io/component"]) where attributes["service.name"] == nil and attributes["app.kubernetes.io/component"] != nil
              - set(attributes["service.name"], "api-gateway") where attributes["service.name"] == "frontend"
              - set(attributes["service.name"], "ingress-gateway") where attributes["service.name"] == "frontendproxy"
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], "api-gateway") where attributes["service.name"] == "frontend"
              - set(attributes["service.name"], "ingress-gateway") where attributes["service.name"] == "frontendproxy"
              - set(attributes["service.name"], "postgresql") where attributes["service.instance.id"] == "postgresql:5432" and attributes["service.name"] == nil
              - set(attributes["service.name"], "valkey-cart") where attributes["redis.version"] != nil and attributes["service.name"] == nil
          - context: metric
            statements:
              - set(resource.attributes["service.name"], "image-provider-nginx") where resource.attributes["service.name"] == nil and HasPrefix(name, "nginx.")
              - set(resource.attributes["service.name"], "frontend-proxy") where resource.attributes["service.name"] == nil and HasPrefix(name, "httpcheck.")
        trace_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], "api-gateway") where attributes["service.name"] == "frontend"
              - set(attributes["service.name"], "ingress-gateway") where attributes["service.name"] == "frontendproxy"
      transform/parse_json_body:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - body != nil and IsString(body) and HasPrefix(body, "{")
            statements:
              - set(cache, ParseJSON(body))
              - flatten(cache, "")
              - merge_maps(attributes, cache, "upsert")
          - context: log
            statements:
              - set(resource.attributes["service.name"], "api-gateway") where resource.attributes["k8s.container.name"] == "frontend"
      # Drain log clustering — derives a template (e.g. "user <*> logged in
      # from <*>") from each log body and writes it to log.record.template.
      # Defaults are fine for the heterogeneous mix of services here; tune
      # tree_depth/merge_threshold later if templates collide or fragment.
      drain: {}
      # Drop low-signal flagd feature-flag evaluation spans:
      # client-side `/flagd.evaluation.v1.Service/*` gRPC calls, and the
      # server-side `resolveBoolean` / jsonEvaluator internals inside flagd.
      filter/drop_flagd_spans:
        error_mode: ignore
        traces:
          span:
            - attributes["rpc.service"] == "flagd.evaluation.v1.Service"
            - resource.attributes["service.name"] == "flagd"

      # Keep only spans worth evaluating: store-chat's per-turn supervisor
      # invocation, and agent's LLM-call spans (opentelemetry-instrumentation-
      # langchain names these "<ModelClassName>.chat", e.g. "ChatBedrockConverse.chat" --
      # match on the ".chat" suffix rather than the exact model class name so this
      # doesn't silently break if the underlying LangChain class changes).
      filter/keep_eval_anchors:
        error_mode: ignore
        traces:
          span:
            - 'not ((resource.attributes["service.name"] == "store-chat" and name == "invoke_agent supervisor") or (resource.attributes["service.name"] == "agent" and IsMatch(name, "\\.chat$")))'

      # Keep only flagd-ui's "Flag changed:" log records for the markers
      # pipeline. flagd-ui's Storage GenServer logs that string via
      # Logger.info on each flag change; filelog scrapes container stdout.
      filter/keep_flag_changes:
        error_mode: ignore
        logs:
          log_record:
            - 'not (IsString(body) and IsMatch(body, "Flag changed: "))'

      # Extract just the "Flag changed: <key> (<old> → <new>) [<source>]" line
      # into marker.message. Phoenix's Logger flushes batched entries as a
      # single stdout write, so container-parser produces one log record whose
      # body is multiple newline-separated lines (request log, response log,
      # the flag-change line, etc.). Without this regex extraction the marker
      # message becomes a wall of unrelated request/response noise.
      transform/marker_message:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - 'IsString(body) and IsMatch(body, "Flag changed: ")'
            statements:
              - 'set(attributes["marker.message"], ExtractPatterns(body, "(?P<msg>Flag changed: [^\n]+)")["msg"])'
    exporters:
      debug/detailed:
        verbosity: detailed
      otlp/honeycomb:
        endpoint: api.honeycomb.io:443
        headers:
          x-honeycomb-team: ${env:HONEYCOMB_INGEST_KEY}
      # Posts a Honeycomb marker per flagd-ui flag-change log record. Reads
      # marker.message off the log attribute set by transform/marker_message.
      honeycombmarker:
        api_key: ${env:HONEYCOMB_MARKERS_KEY}
        markers:
          - type: feature-flag-change
            message_key: marker.message
            rules:
              log_conditions:
                - 'IsString(body) and IsMatch(body, "Flag changed: ")'

      # Ships chat-completion spans (in OTLP JSON) to the llm-evals consumer.
      # The consumer parses the spans, runs Bias/Hallucination/Relevance
      # scorers, and emits a `gen_ai.evaluation.result` log on the original
      # chat span plus a separate eval-trace span tree.
      kafka/llm-evals:
        brokers:
          - kafka:9092
        # Use the trace ID as the kafka message key. Default
        # `record_partitioner: sticky_key` with no key keeps a
        # collector batch on one partition, defeating the
        # llm-evals consumer's partitionsConsumedConcurrently.
        # Trace-id keys spread anchor spans (one per chat turn ⇒
        # unique trace ID) across partitions evenly.
        # NOTE: top-level key, not nested under `traces:`.
        partition_traces_by_id: true
        # As of kafkaexporter v0.151+, topic/encoding live under per-signal
        # subkeys. This pipeline ships traces, so configure under `traces:`.
        traces:
          topic: llm-evals-spans
          encoding: otlp_json
        producer:
          max_message_bytes: 10000000

    service:
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    endpoint: https://api.honeycomb.io
                    headers:
                      - name: x-honeycomb-dataset
                        value: otel-collector-metrics
                      - name: x-honeycomb-team
                        value: ${env:HONEYCOMB_INGEST_KEY}
                    protocol: http/protobuf
                    temporality_preference: delta
      pipelines:
        metrics:
          exporters:
            - otlp/honeycomb
          processors:
            - transform/service_names
            - transform/attribution
        logs:
          receivers:
            - otlp
            - filelog
          exporters:
            - otlp/honeycomb
          processors:
            - transform/parse_json_body
            - transform/service_names
            - transform/access_log_severity
            - transform/filelog_severity
            - transform/pino_trace_fields
            - transform/attribution
            - drain
        traces:
          exporters:
            - otlp/honeycomb
            - spanmetrics
          processors:
            - filter/drop_flagd_spans
            - transform/genai_copy_events_to_span
            - gen_ai_normalizer
            - transform/genai_fix_token_counts
            - transform/service_names
            - transform/attribution

        # Isolated pipeline that ships eval-anchor spans (one per chatbot
        # turn) to the llm-evals service via Kafka. Consumer parses OTLP
        # JSON, extracts gen_ai.input.messages / gen_ai.output.messages,
        # and runs scorers — no producer-side publish_eval calls needed.
        #
        # genai_copy_events_to_span promotes Strands-style event attributes
        # onto the span first; without it, invoke_agent spans arrive at the
        # consumer with gen_ai.input.messages still on span events and the
        # consumer skips them. canonicalize + fix_token_counts keep the eval
        # anchor's token counts consistent with the main traces pipeline.
        traces/evals:
          receivers:
            - otlp
          processors:
            - transform/genai_copy_events_to_span
            - gen_ai_normalizer
            - transform/genai_fix_token_counts
            - filter/keep_eval_anchors
          exporters:
            - kafka/llm-evals

        # Isolated pipeline that publishes a Honeycomb marker per
        # flagd-ui flag-change log record. Gets its own copy of filelog
        # data so it doesn't interfere with the main logs pipeline.
        logs/markers:
          receivers:
            - filelog
          processors:
            - filter/keep_flag_changes
            - transform/marker_message
          exporters:
            - honeycombmarker
  ports:
    otlp:
      hostPort: 0
    otlp-http:
      hostPort: 0
    jaeger-compact:
      hostPort: 0
    jaeger-thrift:
      hostPort: 0
    jaeger-grpc:
      hostPort: 0
    zipkin:
      hostPort: 0

{{- if .Values.services.storechat.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.storechat.name }}
  labels:
    opentelemetry.io/name: {{ .Values.services.storechat.name }}
    app.kubernetes.io/component: {{ .Values.services.storechat.name }}
    app.kubernetes.io/name: {{ .Values.services.storechat.name }}
    app.kubernetes.io/version: "2.1.3"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.storechat.port }}
      name: tcp-service
      targetPort: {{ .Values.services.storechat.port }}
      protocol: TCP
  selector:
    opentelemetry.io/name: {{ .Values.services.storechat.name }}
{{- end }}

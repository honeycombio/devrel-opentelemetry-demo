namespace: default

services:
  llmEvals:
    enabled: false
    name: llm-evals
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-llm-evals
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    awsRegion: ""
    bedrockHaikuProfileArn: ""
    kafkaAddr: ""
    replicas: 1
    env: []

  storechat:
    enabled: true
    name: store-chat
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-storechat
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    awsRegion: ""
    bedrockHaikuProfileArn: ""
    bedrockNovaLiteProfileArn: ""
    bedrockNovaMicroProfileArn: ""
    port: 8080
    replicas: 1
    kafkaAddr: ""
    env:
      - name: STORE_CHAT_PORT
        value: "8080"
      - name: ACCOUNTING_ADDR
        value: "accounting:5060"
      - name: SHIPPING_ADDR
        value: "http://shipping:8080"
      - name: VALKEY_ADDR
        value: "valkey-cart:6379"
      - name: FLAGD_HOST
        value: "flagd"
      - name: FLAGD_PORT
        value: "8013"
      - name: FLAGD_OFREP_PORT
        value: "8016"
      - name: OTEL_SEMCONV_STABILITY_OPT_IN
        value: "gen_ai_latest_experimental"
      - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
        value: "true"

  auth:
    enabled: true
    name: auth
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-auth
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    port: 8080
    replicas: 1
    env:
      - name: AUTH_PORT
        value: "8080"
      - name: FLAGD_HOST
        value: "flagd"
      - name: FLAGD_PORT
        value: "8013"
      - name: DB_CONNECTION_STRING
        value: "host=astronomy-db user=astronomy_user password=astronomy_password dbname=astronomy_db"
      # system roots plus the partner CA for the in-pod third-party stand-ins
      - name: SSL_CERT_DIR
        value: "/etc/ssl/certs:/etc/sso-mocks-ca"
    # hostAliases come from files/auth-host-aliases.yaml (generated by scripts/generate-auth-tenants.py)
    sidecar:
      name: sso-mocks
      image:
        repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
        tag: latest-sso-mocks
        pullPolicy: IfNotPresent
      imageOverride:
        {}

otel:
  collectorName: otel-collector
  metricsTemporality: delta

ingress:
  enabled: false
  className: alb
  subDomainName: "" # e.g. "martin-local"
  domainName: ""
  generateCertificate: false
  # Example: zurelia.honeydemo.io

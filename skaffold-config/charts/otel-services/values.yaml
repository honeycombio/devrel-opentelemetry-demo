namespace: default

services:
  llmEvals:
    enabled: false
    name: llm-evals
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-llm-evals
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    awsRegion: ""
    bedrockHaikuProfileArn: ""
    kafkaAddr: ""
    replicas: 1
    env: []

  storechat:
    enabled: true
    name: store-chat
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-storechat
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    awsRegion: ""
    bedrockHaikuProfileArn: ""
    bedrockNovaLiteProfileArn: ""
    bedrockNovaMicroProfileArn: ""
    port: 8080
    replicas: 1
    kafkaAddr: ""
    env:
      - name: STORE_CHAT_PORT
        value: "8080"
      - name: ACCOUNTING_ADDR
        value: "accounting:5060"
      - name: SHIPPING_ADDR
        value: "http://shipping:8080"
      - name: VALKEY_ADDR
        value: "valkey-cart:6379"
      - name: FLAGD_HOST
        value: "flagd"
      - name: FLAGD_PORT
        value: "8013"
      - name: FLAGD_OFREP_PORT
        value: "8016"
      - name: OTEL_SEMCONV_STABILITY_OPT_IN
        value: "gen_ai_latest_experimental"
      - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
        value: "true"

  agent:
    enabled: true
    name: agent
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-agent
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    awsRegion: ""
    bedrockHaikuProfileArn: ""
    port: 8010
    replicas: 1
    env:
      - name: AGENT_PORT
        value: "8010"
      - name: AGENT_ENDPOINT
        value: "agent"
      - name: GRAPH_RECURSION_LIMIT
        value: "25"
      - name: APPLICATION_ENDPOINT
        value: "frontend:8080"
      - name: MCP_ENABLED
        value: "True"
      - name: MCP_ENDPOINT
        value: "mcp"
      - name: MCP_PORT
        value: "8011"

  mcp:
    enabled: true
    name: mcp
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-mcp
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    port: 8011
    replicas: 1
    env:
      - name: MCP_PORT
        value: "8011"
      - name: MCP_ENDPOINT
        value: "mcp"
      - name: APPLICATION_ENDPOINT
        value: "frontend:8080"

  chatbot:
    enabled: true
    name: chatbot
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-chatbot
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    port: 7860
    replicas: 1
    env:
      - name: CHATBOT_PORT
        value: "7860"
      - name: CHATBOT_ROOT_PATH
        value: "/chatbot"
      - name: AGENT_ENDPOINT
        value: "agent"
      - name: AGENT_PORT
        value: "8010"

  opampServer:
    enabled: true
    name: opamp-server
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-opamp-server
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    port: 4320
    uiPort: 4321
    replicas: 1
    env: []

  telemetryDocs:
    enabled: true
    name: telemetry-docs
    image:
      repository: ghcr.io/honeycombio/devrel-opentelemetry-demo
      tag: latest-telemetry-docs
      pullPolicy: IfNotPresent
    imageOverride:
      {}
    port: 8000
    replicas: 1
    env:
      - name: TELEMETRY_DOCS_PORT
        value: "8000"
      - name: OTEL_COLLECTOR_HOST
        value: "otel-collector"
      - name: OTEL_COLLECTOR_PORT_GRPC
        value: "4317"

otel:
  collectorName: otel-collector
  metricsTemporality: delta

ingress:
  enabled: false
  className: alb
  subDomainName: "" # e.g. "martin-local"
  domainName: ""
  generateCertificate: false
  # Example: zurelia.honeydemo.io

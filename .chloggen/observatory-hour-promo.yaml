note: Add the Observatory Hour promo story. Checkout takes a promo code and, while the `promo.observatory-hour` flag is on, asks accounting to price it from the customer's last 60 minutes of orders (at most 100), which gets slower for heavy buyers. A targeting rule turns the promo on from 01:00, 09:00 and 17:00 UTC for an hour. flagd-ui can now start its flag scheduler from `FLAGD_UI_SCHEDULE_*` environment variables.

